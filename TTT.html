<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            color: #333;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background-color: #f2f2f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            border: 2px solid #333;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
        }

        #status {
            margin-top: 10px;
            font-size: 1.2rem;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div class="game-board">
        <div class="cell" id="cell0" onclick="makeMove(0)"></div>
        <div class="cell" id="cell1" onclick="makeMove(1)"></div>
        <div class="cell" id="cell2" onclick="makeMove(2)"></div>
        <div class="cell" id="cell3" onclick="makeMove(3)"></div>
        <div class="cell" id="cell4" onclick="makeMove(4)"></div>
        <div class="cell" id="cell5" onclick="makeMove(5)"></div>
        <div class="cell" id="cell6" onclick="makeMove(6)"></div>
        <div class="cell" id="cell7" onclick="makeMove(7)"></div>
        <div class="cell" id="cell8" onclick="makeMove(8)"></div>
    </div>
    <button onclick="resetGame()">Reset Game</button>
    <p id="status"></p>

    <script>
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;
        const statusDisplay = document.getElementById('status');

        const winningConditions = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function makeMove(index) {
            if (board[index] === '' && gameActive) {
                board[index] = currentPlayer;
                document.getElementById(`cell${index}`).innerText = currentPlayer;
                checkForWinner();
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            }
        }

        function checkForWinner() {
            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    statusDisplay.innerText = `Player ${board[a]} wins!`;
                    gameActive = false;
                    return;
                }
            }

            if (!board.includes('')) {
                statusDisplay.innerText = "It's a draw!";
                gameActive = false;
            }
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            gameActive = true;
            statusDisplay.innerText = '';
            for (let i = 0; i < board.length; i++) {
                document.getElementById(`cell${i}`).innerText = '';
            }
        }
    </script>
</body>
</html>
