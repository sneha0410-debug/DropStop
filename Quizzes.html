<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Class</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('Quizz.jpg'); 
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .class-options-container {
            display: flex;
            gap: 20px; 
        }
        .class-option {
            background-color: white;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 200px;
            text-align: center;
            cursor: pointer;
            font-size: 1.5rem;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        .class-option a {
            text-decoration: none;
            color: black;
            display: block;
        }
        .class-option:hover {
            background-color: #e0e0e0;
            transform: scale(1.05); 
        }
    </style>
</head>
<body>
    <div class="class-options-container">
        <div class="class-option"><a href="Class 11.html">Class 11</a></div>
        <div class="class-option"><a href="Class 12.html">Class 12</a></div>
    </div>
</body>
</html>
