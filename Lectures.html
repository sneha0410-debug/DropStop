<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Lectures</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: url('Lecture.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .video-container {
            width: 100%;
            padding: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
        }
        .row {
            display: flex;
            justify-content: center;
            gap: 40px;
            width: 100%;
        }
        .video {
            width: 360px;
            border: 2px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.9); 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .video iframe {
            width: 100%;
            height: 200px;
        }
        .video h3 {
            margin: 0;
            padding: 10px;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.1); 
        }
    </style>
</head>
<body>
    <div class="video-container">
        <!-- Class 11 Row -->
        <div class="row">
            <!-- Class 11 Physics -->
            <div class="video">
                <iframe src="https://www.youtube.com/embed/p8sbuPh5xcU" allowfullscreen></iframe>
                <h3>Class 11 Physics: Laws of Motion</h3>
            </div>
            <!-- Class 11 Chemistry -->
            <div class="video">
                <iframe src="https://www.youtube.com/embed/vaOX6L5CbC8" allowfullscreen></iframe>
                <h3>Class 11 Chemistry: Atomic Structure</h3>
            </div>
        </div>
        <!-- Class 12 Row -->
        <div class="row">
            <!-- Class 12 Physics -->
            <div class="video">
                <iframe src="https://www.youtube.com/embed/n_Jr7FinfuU" allowfullscreen></iframe>
                <h3>Class 12 Physics: Electromagnetic Induction</h3>
            </div>
            <!-- Class 12 Chemistry -->
            <div class="video">
                <iframe src="https://www.youtube.com/embed/YzxUZzMrlfQ" allowfullscreen></iframe>
                <h3>Class 12 Chemistry: Organic Chemistry</h3>
            </div>
        </div>
    </div>
</body>
</html>
