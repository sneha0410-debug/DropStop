<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 12 Quizzes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .topics-container {
            display: flex;
            gap: 20px; /* Space between the options */
        }
        .topic {
            background-color: white;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 250px;
            text-align: center;
            cursor: pointer;
            font-size: 1.5rem;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        .topic a {
            text-decoration: none;
            color: black;
            display: block;
        }
        .topic:hover {
            background-color: #e0e0e0;
            transform: scale(1.05); /* Slight zoom effect on hover */
        }
    </style>
</head>
<body>
    <div class="topics-container">
        <div class="topic"><a href="Physics 12.html">Physics</a></div>
        <div class="topic"><a href="Chemistry 12.html">Chemistry</a></div>
    </div>

</body>
</html>
